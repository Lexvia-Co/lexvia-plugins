e\\n\\u003cli\\u003e被经纪报价为$30/平方英尺，却不知道总月供会是多少\\u003c/li\\u003e\\n\\u003cli\\u003e看过两份商业租约，发现条款差异巨大，不知道哪些必须改\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e本指南不涉及：商业贷款审批、税务筹划、特殊行业许可（如大麻店、餐饮酒牌）、买卖商业物业估值。商业租赁合同本身是法律文件，几十页不能靠论坛帖替代律师审查。\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-4\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-4\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e核心词汇速查\\u003c/h2\\u003e\\n\\u003cdiv class=\\\"md-table\\\"\\u003e\\n\\u003ctable\\u003e\\n\\u003cthead\\u003e\\n\\u003ctr\\u003e\\n\\u003cth\\u003e术语\\u003c/th\\u003e\\n\\u003cth\\u003e英文\\u003c/th\\u003e\\n\\u003cth\\u003e一句话解释\\u003c/th\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/thead\\u003e\\n\\u003ctbody\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e基础租金\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003eBase Rent\\u003c/td\\u003e\\n\\u003ctd\\u003e每月固定的基本租费，按平方英尺年价转月\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e额外租金\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003eAdditional Rent\\u003c/td\\u003e\\n\\u003ctd\\u003e物业税、保险、CAM等弹性成本，会变\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e三净租约\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003eTriple Net (NNN)\\u003c/td\\u003e\\n\\u003ctd\\u003e租户承担基础租金、物业税、保险和维护费\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e公共维护费\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003eCAM\\u003c/td\\u003e\\n\\u003ctd\\u003eCommon Area Maintenance，停车场、除雪、公共区域清洁等\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e百分比租约\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003ePercentage Lease\\u003c/td\\u003e\\n\\u003ctd\\u003e基础租金+营业额的百分比分成，常见于商场\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e个人担保\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003ePersonal Guarantee\\u003c/td\\u003e\\n\\u003ctd\\u003e公司欠租金时房东可以追你个人资产\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e续租权\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003eOption to Renew\\u003c/td\\u003e\\n\\u003ctd\\u003e租期到期前可以书面通知房东续租\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e转让权\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003eAssignment/Sublease\\u003c/td\\u003e\\n\\u003ctd\\u003e把经营权转让给别人或分租给别人\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003eHST\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003eHarmonized Sales Tax\\u003c/td\\u003e\\n\\u003ctd\\u003e安省等地商业租金的销售税，通常13%\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003eGST\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003eGoods and Services Tax\\u003c/td\\u003e\\n\\u003ctd\\u003e联邦销售税5%，BC等地按此加收\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/tbody\\u003e\\n\\u003c/table\\u003e\\n\\u003c/div\\u003e\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-vs-5\\\" class=\\\"anchor\\\" href=\\\"#p-85625-vs-5\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e商业 vs 住宅租赁的本质差异\\u003c/h2\\u003e\\n\\u003cp\\u003e如果你做过住宅房东或租客，这些对比很关键：\\u003c/p\\u003e\\n\\u003cdiv class=\\\"md-table\\\"\\u003e\\n\\u003ctable\\u003e\\n\\u003cthead\\u003e\\n\\u003ctr\\u003e\\n\\u003cth\\u003e对比项\\u003c/th\\u003e\\n\\u003cth\\u003e住宅租赁\\u003c/th\\u003e\\n\\u003cth\\u003e商业租赁\\u003c/th\\u003e\\n\\u003cth\\u003e对你的影响\\u003c/th\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/thead\\u003e\\n\\u003ctbody\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e法律保护\\u003c/td\\u003e\\n\\u003ctd\\u003e受省级《住宅租赁法》严格保护\\u003c/td\\u003e\\n\\u003ctd\\u003e主要靠合同法，法律框架有限\\u003c/td\\u003e\\n\\u003ctd\\u003e商业房东锁门驱逐比住宅快很多\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e加租上限\\u003c/td\\u003e\\n\\u003ctd\\u003e多数省份有年度上限（如2.5%）\\u003c/td\\u003e\\n\\u003ctd\\u003e没有官方上限，全凭合同\\u003c/td\\u003e\\n\\u003ctd\\u003e续租时房东可以大幅涨价\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e维修责任\\u003c/td\\u003e\\n\\u003ctd\\u003e房东通常负责基本维修\\u003c/td\\u003e\\n\\u003ctd\\u003e可以全转给租户（NNN模式）\\u003c/td\\u003e\\n\\u003ctd\\u003eHVAC、屋顶维修成本落在你身上\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e提前终止\\u003c/td\\u003e\\n\\u003ctd\\u003e有法律保护，流程复杂\\u003c/td\\u003e\\n\\u003ctd\\u003e合同约定为准，拆迁条款很常见\\u003c/td\\u003e\\n\\u003ctd\\u003e装修还没回本就被赶出去\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e押金规则\\u003c/td\\u003e\\n\\u003ctd\\u003e有官方限额和返还规则\\u003c/td\\u003e\\n\\u003ctd\\u003e房东可要求押金、预付租金、信用证\\u003c/td\\u003e\\n\\u003ctd\\u003e签约前算清楚所有前期成本\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e违约后果\\u003c/td\\u003e\\n\\u003ctd\\u003e法院必须走驱逐程序\\u003c/td\\u003e\\n\\u003ctd\\u003e房东可以直接没收财物、断水电\\u003c/td\\u003e\\n\\u003ctd\\u003e现金流突然断裂风险更大\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/tbody\\u003e\\n\\u003c/table\\u003e\\n\\u003c/div\\u003e\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-6\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-6\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e第一步：识别租约类型\\u003c/h2\\u003e\\n\\u003cp\\u003e看到报价时，先分清是哪种结构，因为这决定了隐形成本。\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-gross-lease-7\\\" class=\\\"anchor\\\" href=\\\"#p-85625-gross-lease-7\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003eGross Lease（全包租约）\\u003c/h3\\u003e\\n\\u003cp\\u003e租户每月付固定金额，房东负责物业税、保险、维修、公用事业。\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003e优点\\u003c/strong\\u003e：预算稳定，最接近住宅租赁\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003e缺点\\u003c/strong\\u003e：房东把风险提前放进租金，账面租金可能偏高\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003e常见于\\u003c/strong\\u003e：灵活办公空间、小办公楼、部分医疗楼\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e问清楚：哪些费用真的包含了？水电是否分表独立？\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-single-net-8\\\" class=\\\"anchor\\\" href=\\\"#p-85625-single-net-8\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003eSingle Net（单净租约）\\u003c/h3\\u003e\\n\\u003cp\\u003e基础租金+租户承担物业税。\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003e有风险\\u003c/strong\\u003e：政府地税涨，你的月供就涨\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-double-net-9\\\" class=\\\"anchor\\\" href=\\\"#p-85625-double-net-9\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003eDouble Net（双净租约）\\u003c/h3\\u003e\\n\\u003cp\\u003e基础租金+租户承担物业税+建筑保险。\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003e有风险\\u003c/strong\\u003e：同上，加上保险可能上涨\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-triple-netnnn-10\\\" class=\\\"anchor\\\" href=\\\"#p-85625-triple-netnnn-10\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003eTriple Net（NNN租约）\\u003cstrong\\u003e[最常见，最需要警惕]\\u003c/strong\\u003e\\u003c/h3\\u003e\\n\\u003cp\\u003e基础租金+租户承担物业税+保险+CAM维护费。\\u003c/p\\u003e\\n\\u003cp\\u003e关键数字：加拿大A级写字楼和核心商圈，Additional Rent通常占总占用成本的\\u003cstrong\\u003e35%-50%\\u003c/strong\\u003e。换句话说，如果基础租金是$3000/月，额外租金可能再加$1500-$2500。\\u003c/p\\u003e\\n\\u003cp\\u003e计算公式：\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\"lang-auto\\\"\\u003e真实月供 = Base Rent + 物业税(按面积比例) + 保险(按面积比例) + CAM + GST/HST\\n例：1000平方英尺铺位\\n  = $3000 + $600(税) + $200(保) + $800(CAM) + $702(13% HST)\\n  = $5302/月  // 不是基础租金的$3000\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-percentage-lease-11\\\" class=\\\"anchor\\\" href=\\\"#p-85625-percentage-lease-11\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003ePercentage Lease（百分比租约）\\u003c/h3\\u003e\\n\\u003cp\\u003e常见于大商场。基础租金+营业总额的百分比（如5%-10%）。\\u003c/p\\u003e\\n\\u003cp\\u003e谈判要点：底租要够低，不然淡季根本赚不回来。\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-cam-12\\\" class=\\\"anchor\\\" href=\\\"#p-85625-cam-12\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e第二步：理解CAM费用（最容易踩坑）\\u003c/h2\\u003e\\n\\u003cp\\u003eCAM（Common Area Maintenance）是NNN租约中最有争议的部分。不是简单的\\\"停车场清洁费\\\"，而是一个\\\"黑盒\\\"。\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-cam-13\\\" class=\\\"anchor\\\" href=\\\"#p-85625-cam-13\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003eCAM通常包括\\u003c/h3\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e停车场维护、沥青修缮、划线\\u003c/li\\u003e\\n\\u003cli\\u003e除雪、割草、绿化\\u003c/li\\u003e\\n\\u003cli\\u003e公共区域清洁（走廊、电梯、大堂、洗手间）\\u003c/li\\u003e\\n\\u003cli\\u003e保安、照明、垃圾处理\\u003c/li\\u003e\\n\\u003cli\\u003e物业管理费（通常总租金的3%-6%）\\u003c/li\\u003e\\n\\u003cli\\u003e公用事业的公摊部分（如暖通空调、水电）\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-h-14\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-14\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e租户常遇到的\\\"坑\\\"\\u003c/h3\\u003e\\n\\u003cp\\u003e坑1：资本性支出摊销\\u003cbr\\u003e\\n房东今年更换停车场沥青或整栋楼的HVAC系统，费用达$50万。房东可能会在CAM中摊销，租户今年的CAM费用翻倍。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e你该怎么做\\u003c/strong\\u003e：合同必须明确区分\\\"日常维护\\\"和\\\"资本支出\\\"。资本支出应该分年摊销或由房东自己承担。\\u003c/p\\u003e\\n\\u003cp\\u003e坑2：管理费叠加\\u003cbr\\u003e\\n房东不仅收CAM本身的费用，还在所有费用基础上再加15%的\\\"管理费\\\"或\\\"行政费\\\"。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e你该怎么做\\u003c/strong\\u003e：要求CAM明细中不含重复计费。\\u003c/p\\u003e\\n\\u003cp\\u003e坑3：没有上限，年年涨\\u003cbr\\u003e\\n没有合同限制的情况下，房东可以随意提高CAM。2024年$1000/月，2025年涨到$1300，2026年$1600。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e你该怎么做\\u003c/strong\\u003e：写进合同\\\"CAM年度涨幅不超过CPI+2%“或\\\"不超过3%”。这不是苛刻要求，是标准商业做法。\\u003c/p\\u003e\\n\\u003cp\\u003e坑4：无法审计\\u003cbr\\u003e\\n房东从不提供CAM账单明细，你不知道那笔钱花在哪里。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e你该怎么做\\u003c/strong\\u003e：合同必须明确\\\"租户有权每年审计CAM支出，房东需提供详细账单\\\"。这个权利很重要。\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-cam-15\\\" class=\\\"anchor\\\" href=\\\"#p-85625-cam-15\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e谈CAM的实战\\u003c/h3\\u003e\\n\\u003cp\\u003e签约前要求房东提供过去3年的CAM历史数据：\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e2024年CAM：$10800/年（$900/月）\\u003c/li\\u003e\\n\\u003cli\\u003e2025年CAM：$11500/年（$958/月）涎幅 6.5%\\u003c/li\\u003e\\n\\u003cli\\u003e2026年CAM：$12200/年（$1017/月）涎幅 6.1%\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003e看完这个历史后，你就能判断：\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e这栋楼的维护质量如何\\u003c/li\\u003e\\n\\u003cli\\u003e房东的费用控制能力如何\\u003c/li\\u003e\\n\\u003cli\\u003e最近是否有大项目支出\\u003c/li\\u003e\\n\\u003cli\\u003e未来的合理预算应该是多少\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-16\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-16\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e第三步：四大\\\"致命\\\"条款\\u003c/h2\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-personal-guarantee-17\\\" class=\\\"anchor\\\" href=\\\"#p-85625-personal-guarantee-17\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e① 个人担保（Personal Guarantee）\\u003c/h3\\u003e\\n\\u003cp\\u003e大多数房东要求新租户的股东进行个人担保。意思是：\\u003c/p\\u003e\\n\\u003cp\\u003e如果生意亏损、公司倒闭，房东有权冻结你的个人银行账户、抵押你的房子来偿还剩余租金。\\u003c/p\\u003e\\n\\u003cp\\u003e一个餐厅租5年、月租$8000，如果第2年因为疫情关闭，剩余48个月的租金是$384,000。房东可以直接起诉你个人。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e怎么谈\\u003c/strong\\u003e：\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e争取\\\"有限担保\\\"：只担保前2年或担保金额上限为$50,000\\u003c/li\\u003e\\n\\u003cli\\u003e争取\\\"自动解除\\\"：营业满3年且无违约记录，自动解除担保\\u003c/li\\u003e\\n\\u003cli\\u003e争取\\\"逐年递减\\\"：第1年100%担保，第2年80%，第3年0%\\u003c/li\\u003e\\n\\u003cli\\u003e最差情况下：至少要求担保数额不超过12个月的租金\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-demolition-clause-18\\\" class=\\\"anchor\\\" href=\\\"#p-85625-demolition-clause-18\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e② 拆迁条款（Demolition Clause）\\u003c/h3\\u003e\\n\\u003cp\\u003e在温哥华Broadway、多伦多Yonge St这类高密度区域，房东常加这条：\\u003c/p\\u003e\\n\\u003cp\\u003e“如果大楼拆迁改建，房东只需提前6个月通知，即可终止租约。”\\u003c/p\\u003e\\n\\u003cp\\u003e场景：你花$50万装修了一家餐厅，第2年房东收到开发商的收购要约。房东给你6个月通知，你要搬家。5年租约变成2年，装修投入打水漂。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e怎么谈\\u003c/strong\\u003e：\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e争取\\\"拆迁补偿\\\"：至少给予3-6个月的租金作为搬迁补偿\\u003c/li\\u003e\\n\\u003cli\\u003e争取\\\"提前通知期\\\"：延长至12个月\\u003c/li\\u003e\\n\\u003cli\\u003e争取\\\"装修摊销\\\"：如果拆迁发生在租期内，房东补偿未摊销的装修成本\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-option-to-renew-19\\\" class=\\\"anchor\\\" href=\\\"#p-85625-option-to-renew-19\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e③ 续租选择权（Option to Renew）\\u003c/h3\\u003e\\n\\u003cp\\u003e这个很容易被忽视，但后果很严重。\\u003c/p\\u003e\\n\\u003cp\\u003e住宅租约到期，通常自动转为按月。商业租约不同：\\u003cstrong\\u003e到期就是到期，没有自动续租。\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e如果合同里没有\\\"Option to Renew\\\"条款，租期到期那天：\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e你的钥匙失效\\u003c/li\\u003e\\n\\u003cli\\u003e房东可以把铺位转租给出价更高的人\\u003c/li\\u003e\\n\\u003cli\\u003e你的生意就地解散\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e怎么谈\\u003c/strong\\u003e：\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e必须争取至少2个续租选项，每次5年（总共15年）\\u003c/li\\u003e\\n\\u003cli\\u003e必须写明：续租租金按\\\"市场价\\\"或\\\"当前租金+X%\\\"\\u003c/li\\u003e\\n\\u003cli\\u003e必须明确行使方式：租期到期前6-12个月以书面形式通知房东\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-fixturing-period-rent-abatement-20\\\" class=\\\"anchor\\\" href=\\\"#p-85625-fixturing-period-rent-abatement-20\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e④ 装修期和租金减免（Fixturing Period \\u0026amp; Rent Abatement）\\u003c/h3\\u003e\\n\\u003cp\\u003e装修一家餐厅需要3个月，这期间你没有收入，但仍需支付租金。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e怎么谈\\u003c/strong\\u003e：\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e争取\\\"免租期\\\"：至少1-3个月的完全免租\\u003c/li\\u003e\\n\\u003cli\\u003e次优方案：部分减免（如第1个月50%租金，第2-3个月75%租金）\\u003c/li\\u003e\\n\\u003cli\\u003e写进合同具体的开工日期、装修期长度、减免的确切金额\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-21\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-21\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e第四步：算清真实月供\\u003c/h2\\u003e\\n\\u003cp\\u003e不要被$30/平方英尺的报价迷惑。\\u003c/p\\u003e\\n\\u003cp\\u003e假设你在多伦多看中一个1000平方英尺的商铺，经纪报价$3000/月（$36/平方英尺/年）。\\u003c/p\\u003e\\n\\u003cp\\u003e第一次对话：问房东\\\"总占用成本是多少？\\\"\\u003c/p\\u003e\\n\\u003cp\\u003e房东应该给你这样的清单：\\u003c/p\\u003e\\n\\u003cdiv class=\\\"md-table\\\"\\u003e\\n\\u003ctable\\u003e\\n\\u003cthead\\u003e\\n\\u003ctr\\u003e\\n\\u003cth\\u003e项目\\u003c/th\\u003e\\n\\u003cth\\u003e金额\\u003c/th\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/thead\\u003e\\n\\u003ctbody\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003eBase Rent\\u003c/td\\u003e\\n\\u003ctd\\u003e$3,000\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e物业税分摊\\u003c/td\\u003e\\n\\u003ctd\\u003e$600\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e保险分摊\\u003c/td\\u003e\\n\\u003ctd\\u003e$200\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003eCAM（公共维护费）\\u003c/td\\u003e\\n\\u003ctd\\u003e$800\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e小计\\u003c/td\\u003e\\n\\u003ctd\\u003e$4,600\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003eHST (13%)\\u003c/td\\u003e\\n\\u003ctd\\u003e$598\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e真实月供\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003e$5,198\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/tbody\\u003e\\n\\u003c/table\\u003e\\n\\u003c/div\\u003e\\u003cp\\u003e看起来贵了73%。现在你才知道真实成本。\\u003c/p\\u003e\\n\\u003cp\\u003e什么时候要求这份清单：\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e看Offer to Lease时（不是签字时）\\u003c/li\\u003e\\n\\u003cli\\u003e要求房东逐项列出过去12个月的数字\\u003c/li\\u003e\\n\\u003cli\\u003e要求房东给出未来3年的预估\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-5-22\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-5-22\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e第五步：合同最关键的5条检查清单\\u003c/h2\\u003e\\n\\u003cp\\u003e签约前，一定要让商业地产律师检查以下条款：\\u003c/p\\u003e\\n\\u003cdiv class=\\\"md-table\\\"\\u003e\\n\\u003ctable\\u003e\\n\\u003cthead\\u003e\\n\\u003ctr\\u003e\\n\\u0 ly-emoji\\\" alt=\\\":star:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/star.png?v=15\\\" title=\\\":star:\\\" class=\\\"emoji only-emoji\\\" alt=\\\":star:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/star.png?v=15\\\" title=\\\":star:\\\" class=\\\"emoji only-emoji\\\" alt=\\\":star:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003eDefault \\u0026amp; Remedies（违约与补救）\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003e违约定义？给多少天改正？罚金多少？\\u003c/td\\u003e\\n\\u003ctd\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/star.png?v=15\\\" title=\\\":star:\\\" class=\\\"emoji only-emoji\\\" alt=\\\":star:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/star.png?v=15\\\" title=\\\":star:\\\" class=\\\"emoji only-emoji\\\" alt=\\\":star:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/star.png?v=15\\\" title=\\\":star:\\\" class=\\\"emoji only-emoji\\\" alt=\\\":star:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e\\u003cstrong\\u003eForce Majeure（不可抗力）\\u003c/strong\\u003e\\u003c/td\\u003e\\n\\u003ctd\\u003e疫情、天灾能否暂停租金？\\u003c/td\\u003e\\n\\u003ctd\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/star.png?v=15\\\" title=\\\":star:\\\" class=\\\"emoji only-emoji\\\" alt=\\\":star:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/star.png?v=15\\\" title=\\\":star:\\\" class=\\\"emoji only-emoji\\\" alt=\\\":star:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/tbody\\u003e\\n\\u003c/table\\u003e\\n\\u003c/div\\u003e\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-23\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-23\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e真实场景：三个\\\"翻车\\\"故事\\u003c/h2\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-h-1cam-24\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-1cam-24\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e场景1：CAM无底线\\u003c/h3\\u003e\\n\\u003cp\\u003e小李在多伦多开了一家咖啡厅，看好了一个年租$36,000的铺位。合同上写基础租金$3000/月，CAM\\\"按实际支出\\\"，没有上限。\\u003c/p\\u003e\\n\\u003cp\\u003e第1年：CAM $800/月（预期）\\u003cbr\\u003e\\n第2年：CAM $1100/月（楼上发生水灾，修缮费摊销）\\u003cbr\\u003e\\n第3年：CAM $1500/月（房东更换停车场）\\u003c/p\\u003e\\n\\u003cp\\u003e小李的总月支出从$3800涨到$4500。生意利润微薄，几乎要关店。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e教训\\u003c/strong\\u003e：合同里必须写\\\"CAM年度涨幅不超过CPI+2%“或明确列出\\\"资本支出不计入当年CAM”。\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-h-2-25\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-2-25\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e场景2：个人担保的隐患\\u003c/h3\\u003e\\n\\u003cp\\u003e王女士和丈夫合伙开诊所，租了一个2000平方英尺的医疗楼铺位。\\u003c/p\\u003e\\n\\u003cp\\u003e基础租金$6000/月，5年合同。\\u003c/p\\u003e\\n\\u003cp\\u003e第3年，丈夫突然病重无法工作，生意开始亏损。第4年，无法继续支付租金。\\u003c/p\\u003e\\n\\u003cp\\u003e房东根据合同的\\\"无限个人担保\\\"条款，起诉王女士。她要偿还剩余18个月的租金$108,000，连律师费一起，总额超过$150,000。\\u003c/p\\u003e\\n\\u003cp\\u003e她的诊所、房子都被冻结。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e教训\\u003c/strong\\u003e：签约前就应该争取\\\"有限担保\\\"（如担保金额上限为$50,000或6个月租金）或\\\"时间限制\\\"（仅前2年生效）。\\u003c/p\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-h-3-26\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-3-26\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e场景3：拆迁通知\\u003c/h3\\u003e\\n\\u003cp\\u003e张先生在温哥华Broadway租了一个100平方米的餐厅，租金$8000/月，装修投入$200,000。\\u003c/p\\u003e\\n\\u003cp\\u003e租了18个月后，房东突然来电：\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e“我们收到开发商的收购要约，会在6个月后拆迁。根据合同第15条，你需要搬家。”\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003e张先生的餐厅装修还没收回成本，就要全部撤出。最后转让价格很低，亏损严重。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15\\\" title=\\\":warning:\\\" class=\\\"emoji\\\" alt=\\\":warning:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cstrong\\u003e教训\\u003c/strong\\u003e：合同里应该有\\\"拆迁补偿条款\\\"，至少给3-6个月的搬迁期，最好有补偿金额。\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-27\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-27\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e按严重程度分级补救\\u003c/h2\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-offer-to-lease-28\\\" class=\\\"anchor\\\" href=\\\"#p-85625-offer-to-lease-28\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/red_circle.png?v=15\\\" title=\\\":red_circle:\\\" class=\\\"emoji\\\" alt=\\\":red_circle:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e 如果已经签了Offer to Lease\\u003c/h3\\u003e\\n\\u003cp\\u003e立即行动（通常还有48-72小时反悔期）：\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e不要付定金\\u003c/li\\u003e\\n\\u003cli\\u003e发给商业地产律师，让他检查是否有约束力、是否有冷静期\\u003c/li\\u003e\\n\\u003cli\\u003e在律师意见前不要做任何承诺\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-lease-29\\\" class=\\\"anchor\\\" href=\\\"#p-85625-lease-29\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/yellow_circle.png?v=15\\\" title=\\\":yellow_circle:\\\" class=\\\"emoji\\\" alt=\\\":yellow_circle:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e 如果已经签了正式Lease但还没交房\\u003c/h3\\u003e\\n\\u003cp\\u003e立即行动：\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e查合同条件、冷静期、房东交付义务\\u003c/li\\u003e\\n\\u003cli\\u003e看能否在房东交房前修改核心条款（特别是个人担保、CAM上限、续租权）\\u003c/li\\u003e\\n\\u003cli\\u003e联系律师评估违约赔偿 vs 被迫继续的成本\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003ch3\\u003e\\u003ca name=\\\"p-85625-h-30\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-30\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e\\u003cimg src=\\\"https://bbs.fcgvisa.com/images/emoji/apple/green_circle.png?v=15\\\" title=\\\":green_circle:\\\" class=\\\"emoji\\\" alt=\\\":green_circle:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e 如果已经在营业\\u003c/h3\\u003e\\n\\u003cp\\u003e定期维护：\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e保存每月的CAM账单明细（为日后审计准备）\\u003c/li\\u003e\\n\\u003cli\\u003e建立与房东的书面沟通记录（邮件而非口头）\\u003c/li\\u003e\\n\\u003cli\\u003e提前12个月准备续租谈判（不要等到倒计时）\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-31\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-31\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e常见问题\\u003c/h2\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQ：租一个1000平方英尺的铺位，基础租金$3000，实际月供会是多少？\\u003c/strong\\u003e\\u003cbr\\u003e\\nA：\\u003cstrong\\u003e$4500-5500左右\\u003c/strong\\u003e。包含物业税$400-600、保险$200、CAM$600-1000、HST$500-700。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQ：能不能要求房东降低基础租金，自己承担CAM？\\u003c/strong\\u003e\\u003cbr\\u003e\\nA：\\u003cstrong\\u003e不行\\u003c/strong\\u003e。NNN结构下，房东不会同意，因为他失去了运营收益。你可以谈的是\\\"CAM有上限\\\"和\\\"可以审计\\\"。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQ：Lease还没签，但房东说\\\"不用律师，我们很友好\\\"？\\u003c/strong\\u003e\\u003cbr\\u003e\\nA：\\u003cstrong\\u003e一定要找律师\\u003c/strong\\u003e。商业租约太复杂，一个条款漏洞可能导致几万块的损失或生意失败。律师费$2000-5000值得。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQ：生意不景气，能要求房东减租吗？\\u003c/strong\\u003e\\u003cbr\\u003e\\nA：\\u003cstrong\\u003e很难\\u003c/strong\\u003e。商业租约没有\\\"生意不好\\\"的法定减租条款。除非合同里明确写了Percentage Lease或其他调整条款，否则要靠你去谈。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQ：租期5年，第3年想搬家，能不能提前终止？\\u003c/strong\\u003e\\u003cbr\\u003e\\nA：\\u003cstrong\\u003e看合同\\u003c/strong\\u003e。有的合同允许\\\"提前终止\\\"但要付罚金（通常是3-6个月租金），有的不允许。必须签约前问清楚。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQ：CAM里房东多收了钱，怎么办？\\u003c/strong\\u003e\\u003cbr\\u003e\\nA：\\u003cstrong\\u003e要求审计\\u003c/strong\\u003e。如果合同赋予了你审计权，雇个会计或建筑管理公司审计过去12个月的CAM支出。通常能找出10%-20%的超收。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQ：担保人还能改吗？\\u003c/strong\\u003e\\u003cbr\\u003e\\nA：\\u003cstrong\\u003e可以谈\\u003c/strong\\u003e。如果你的个人信用变好，或者公司经营稳定3年了，可以书面要求房东解除担保。但要看合同里有无\\\"自动解除条款\\\"。\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eQ：转租给别人，房东能阻止吗？\\u003c/strong\\u003e\\u003cbr\\u003e\\nA：\\u003cstrong\\u003e可能\\u003c/strong\\u003e。大多数商业合同要求房东同意才能转租，房东可以设置条件（如新租户的信用审查）。必须看合同。\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-32\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-32\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e官方资源链接库\\u003c/h2\\u003e\\n\\u003cdiv class=\\\"md-table\\\"\\u003e\\n\\u003ctable\\u003e\\n\\u003cthead\\u003e\\n\\u003ctr\\u003e\\n\\u003cth\\u003e资源\\u003c/th\\u003e\\n\\u003cth\\u003e链接\\u003c/th\\u003e\\n\\u003cth\\u003e用途\\u003c/th\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/thead\\u003e\\n\\u003ctbody\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e安省商业租赁法\\u003c/td\\u003e\\n\\u003ctd\\u003eontario.ca/laws/statute/90c035\\u003c/td\\u003e\\n\\u003ctd\\u003e基础法律框架\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003eBC省商业租赁法\\u003c/td\\u003e\\n\\u003ctd\\u003elegislation.bc.ca/civix/document/id/complete/statreg/00_04004_01\\u003c/td\\u003e\\n\\u003ctd\\u003eBC租赁规则\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003eBOMA Canada\\u003c/td\\u003e\\n\\u003ctd\\u003ebomac.ca\\u003c/td\\u003e\\n\\u003ctd\\u003e商业面积测量标准\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003eBDC商业租赁指南\\u003c/td\\u003e\\n\\u003ctd\\u003ebdc.ca/resources\\u003c/td\\u003e\\n\\u003ctd\\u003e租赁流程和费用估算\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e加拿大律师协会-商业租赁\\u003c/td\\u003e\\n\\u003ctd\\u003elawsociety.ca\\u003c/td\\u003e\\n\\u003ctd\\u003e律师检索\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003eCRA商业租金GST/HST\\u003c/td\\u003e\\n\\u003ctd\\u003ecanada.ca/taxes\\u003c/td\\u003e\\n\\u003ctd\\u003e税务确认\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/tbody\\u003e\\n\\u003c/table\\u003e\\n\\u003c/div\\u003e\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-33\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-33\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e微出国最后总结\\u003c/h2\\u003e\\n\\u003cp\\u003e商业租赁本质上是一场力量对等的合同谈判。房东有经验、有律师，租户通常匆匆签字。最大的亏是\\\"信息不对称\\\"。\\u003c/p\\u003e\\n\\u003cp\\u003e一定要做的事：\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e要求房东提供\\\"总占用成本\\\"清单，而不是单独的基础租金\\u003c/li\\u003e\\n\\u003cli\\u003e过去3年的CAM历史数据，用来判断未来涨幅\\u003c/li\\u003e\\n\\u003cli\\u003e合同让律师逐条检查（不是\\\"大概看看\\\"）\\u003c/li\\u003e\\n\\u003cli\\u003e在Offer to Lease阶段就介入律师，成本最低\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003e一定不要做的事：\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e只看基础租金做决定\\u003c/li\\u003e\\n\\u003cli\\u003e相信房东\\\"我们很友好，不用律师\\\"的说法\\u003c/li\\u003e\\n\\u003cli\\u003e签字前不问清续租权、拆迁条款、个人担保范围\\u003c/li\\u003e\\n\\u003cli\\u003e没有CAM上限和审计权的情况下签约\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003e商业租赁几乎每个条款都能谈。律师的工作就是帮你争取最有利的条款。第一次可能会很\\\"麻烦\\\"，但这种麻烦是值得的。\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-85625-h-34\\\" class=\\\"anchor\\\" href=\\\"#p-85625-h-34\\\" aria-label=\\\"标题链接\\\"\\u003e\\u003c/a\\u003e免责声明\\u003c/h2\\u003e\\n\\u003cp\\u003e本指南仅供参考，不构成法律或投资建议。商业租赁合同涉及法律风险和财务承诺，任何重大决定前请咨询合格的商业地产律师和会计师。各省法律框架不同，本指南主要基于安省和BC省规则。具体条款以官方法律文件为准。               <p><img src="https://bbs.fcgvisa.com/images/emoji/apple/date.png?v=15" title=":date:" class="emoji" alt=":date:" loading="lazy" width="20" height="20"> 更新于 2026-05-25 | 数据截至 2024-2026年 | 下次复审：2026-11-24</p>
<h2><a name="p-85625-h-1" class="anchor" href="#p-85625-h-1" aria-label="标题链接"></a>一句话核心</h2>
<p>商业租赁靠合同不靠法律保护，NNN租约下的额外支出轻易超过总成本的40%。</p>
<h2><a name="p-85625-h-2" class="anchor" href="#p-85625-h-2" aria-label="标题链接"></a>快速判断卡片</h2>
<ul>
<li><strong>总占用成本</strong> 不止基础租金，还要加物业税、保险、CAM、GST/HST</li>
<li><strong>NNN租约</strong> 租户分摊房东的税费维护，可能比全包贵</li>
<li><strong>CAM审计权</strong> 必须写进合同，每年要看账单明细</li>
<li><strong>续租选择权</strong> 到期自动赶走，需要提前书面通知留位置</li>
<li><strong>个人担保</strong> 生意关了还要赔租金，尽量限额限期</li>
<li><strong>律师必备</strong> 签字前先找商业地产律师，合同通常几十页</li>
</ul>
<hr>
<h2><a name="p-85625-h-3" class="anchor" href="#p-85625-h-3" aria-label="标题链接"></a>这篇指南适合你，如果</h2>
<ul>
<li>正在看Offer to Lease或Lease Agreement，但不清楚Base Rent和Additional Rent的区别</li>
<li>从住宅房东身份转向商业地产，习惯了法律"自动保护"的思维</li>
<li>被经纪报价为$30/平方英尺，却不知道总月供会是多少</li>
<li>看过两份商业租约，发现条款差异巨大，不知道哪些必须改</li>
</ul>
<p>本指南不涉及：商业贷款审批、税务筹划、特殊行业许可（如大麻店、餐饮酒牌）、买卖商业物业估值。商业租赁合同本身是法律文件，几十页不能靠论坛帖替代律师审查。</p>
<hr>
<h2><a name="p-85625-h-4" class="anchor" href="#p-85625-h-4" aria-label="标题链接"></a>核心词汇速查</h2>
<div class="md-table">
<table>
<thead>
<tr>
<th>术语</th>
<th>英文</th>
<th>一句话解释</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>基础租金</strong></td>
<td>Base Rent</td>
<td>每月固定的基本租费，按平方英尺年价转月</td>
</tr>
<tr>
<td><strong>额外租金</strong></td>
<td>Additional Rent</td>
<td>物业税、保险、CAM等弹性成本，会变</td>
</tr>
<tr>
<td><strong>三净租约</strong></td>
<td>Triple Net (NNN)</td>
<td>租户承担基础租金、物业税、保险和维护费</td>
</tr>
<tr>
<td><strong>公共维护费</strong></td>
<td>CAM</td>
<td>Common Area Maintenance，停车场、除雪、公共区域清洁等</td>
</tr>
<tr>
<td><strong>百分比租约</strong></td>
<td>Percentage Lease</td>
<td>基础租金+营业额的百分比分成，常见于商场</td>
</tr>
<tr>
<td><strong>个人担保</strong></td>

</tr>
<tr>
<td><strong>续租权</strong></td>

</tr>

</tr>
<tr>
<td><strong>HST</strong></td>
<td>Harmonized Sales Tax</td>
<td>安省等地商业租金的销售税，通常13%</td>
</tr>
<tr>
<td><strong>GST</strong></td>
<td>Goods and Services Tax</td>
<td>联邦销售税5%，BC等地按此加收</td>
</tr>
</tbody>
</table>
</div><hr>
<h2><a name="p-85625-vs-5" class="anchor" href="#p-85625-vs-5" aria-label="标题链接"></a>商业 vs 住宅租赁的本质差异</h2>
<p>如果你做过住宅房东或租客，这些对比很关键：</p>
<div class="md-table">
<table>
<thead>
<tr>
<th>对比项</th>
<th>住宅租赁</th>
<th>商业租赁</th>
<th>对你的影响</th>
</tr>
</thead>
<tbody>
<tr>
<td>法律保护</td>
<td>受省级《住宅租赁法》严格保护</td>
<td>主要靠合同法，法律框架有限</td>
<td>商业房东锁门驱逐比住宅快很多</td>
</tr>
<tr>
<td>加租上限</td>
<td>多数省份有年度上限（如2.5%）</td>
<td>没有官方上限，全凭合同</td>
<td>续租时房东可以大幅涨价</td>
</tr>
<tr>
<td>维修责任</td>
<td>房东通常负责基本维修</td>
<td>可以全转给租户（NNN模式）</td>
<td>HVAC、屋顶维修成本落在你身上</td>
</tr>
<tr>
<td>提前终止</td>
<td>有法律保护，流程复杂</td>
<td>合同约定为准，拆迁条款很常见</td>
<td>装修还没回本就被赶出去</td>
</tr>
<tr>
<td>押金规则</td>
<td>有官方限额和返还规则</td>
<td>房东可要求押金、预付租金、信用证</td>
<td>签约前算清楚所有前期成本</td>
</tr>
<tr>
<td>违约后果</td>
<td>法院必须走驱逐程序</td>
<td>房东可以直接没收财物、断水电</td>
<td>现金流突然断裂风险更大</td>
</tr>
</tbody>
</table>
</div><hr>
<h2><a name="p-85625-h-6" class="anchor" href="#p-85625-h-6" aria-label="标题链接"></a>第一步：识别租约类型</h2>
<p>看到报价时，先分清是哪种结构，因为这决定了隐形成本。</p>
<h3><a name="p-85625-gross-lease-7" class="anchor" href="#p-85625-gross-lease-7" aria-label="标题链接"></a>Gross Lease（全包租约）</h3>
<p>租户每月付固定金额，房东负责物业税、保险、维修、公用事业。</p>
<ul>
<li><strong>优点</strong>：预算稳定，最接近住宅租赁</li>
<li><strong>缺点</strong>：房东把风险提前放进租金，账面租金可能偏高</li>
<li><strong>常见于</strong>：灵活办公空间、小办公楼、部分医疗楼</li>
</ul>
<p>问清楚：哪些费用真的包含了？水电是否分表独立？</p>
<h3><a name="p-85625-single-net-8" class="anchor" href="#p-85625-single-net-8" aria-label="标题链接"></a>Single Net（单净租约）</h3>
<p>基础租金+租户承担物业税。</p>
<ul>
<li><strong>有风险</strong>：政府地税涨，你的月供就涨</li>
</ul>
<h3><a name="p-85625-double-net-9" class="anchor" href="#p-85625-double-net-9" aria-label="标题链接"></a>Double Net（双净租约）</h3>
<p>基础租金+租户承担物业税+建筑保险。</p>
<ul>
<li><strong>有风险</strong>：同上，加上保险可能上涨</li>
</ul>
<h3><a name="p-85625-triple-netnnn-10" class="anchor" href="#p-85625-triple-netnnn-10" aria-label="标题链接"></a>Triple Net（NNN租约）<strong>[最常见，最需要警惕]</strong></h3>
<p>基础租金+租户承担物业税+保险+CAM维护费。</p>
<p>关键数字：加拿大A级写字楼和核心商圈，Additional Rent通常占总占用成本的<strong>35%-50%</strong>。换句话说，如果基础租金是$3000/月，额外租金可能再加$1500-$2500。</p>
<p>计算公式：</p>
<pre><code class="lang-auto">真实月供 = Base Rent + 物业税(按面积比例) + 保险(按面积比例) + CAM + GST/HST
例：1000平方英尺铺位
  = $3000 + $600(税) + $200(保) + $800(CAM) + $702(13% HST)
  = $5302/月  // 不是基础租金的$3000
</code></pre>
<h3><a name="p-85625-percentage-lease-11" class="anchor" href="#p-85625-percentage-lease-11" aria-label="标题链接"></a>Percentage Lease（百分比租约）</h3>
<p>常见于大商场。基础租金+营业总额的百分比（如5%-10%）。</p>
<p>谈判要点：底租要够低，不然淡季根本赚不回来。</p>
<hr>
<h2><a name="p-85625-cam-12" class="anchor" href="#p-85625-cam-12" aria-label="标题链接"></a>第二步：理解CAM费用（最容易踩坑）</h2>
<p>CAM（Common Area Maintenance）是NNN租约中最有争议的部分。不是简单的"停车场清洁费"，而是一个"黑盒"。</p>
<h3><a name="p-85625-cam-13" class="anchor" href="#p-85625-cam-13" aria-label="标题链接"></a>CAM通常包括</h3>
<ul>
<li>停车场维护、沥青修缮、划线</li>
<li>除雪、割草、绿化</li>
<li>公共区域清洁（走廊、电梯、大堂、洗手间）</li>
<li>保安、照明、垃圾处理</li>
<li>物业管理费（通常总租金的3%-6%）</li>
<li>公用事业的公摊部分（如暖通空调、水电）</li>
</ul>
<h3><a name="p-85625-h-14" class="anchor" href="#p-85625-h-14" aria-label="标题链接"></a>租户常遇到的"坑"</h3>
<p>坑1：资本性支出摊销<br>
房东今年更换停车场沥青或整栋楼的HVAC系统，费用达$50万。房东可能会在CAM中摊销，租户今年的CAM费用翻倍。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>你该怎么做</strong>：合同必须明确区分"日常维护"和"资本支出"。资本支出应该分年摊销或由房东自己承担。</p>
<p>坑2：管理费叠加<br>
房东不仅收CAM本身的费用，还在所有费用基础上再加15%的"管理费"或"行政费"。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>你该怎么做</strong>：要求CAM明细中不含重复计费。</p>
<p>坑3：没有上限，年年涨<br>
没有合同限制的情况下，房东可以随意提高CAM。2024年$1000/月，2025年涨到$1300，2026年$1600。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>你该怎么做</strong>：写进合同"CAM年度涨幅不超过CPI+2%“或"不超过3%”。这不是苛刻要求，是标准商业做法。</p>
<p>坑4：无法审计<br>
房东从不提供CAM账单明细，你不知道那笔钱花在哪里。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>你该怎么做</strong>：合同必须明确"租户有权每年审计CAM支出，房东需提供详细账单"。这个权利很重要。</p>
<h3><a name="p-85625-cam-15" class="anchor" href="#p-85625-cam-15" aria-label="标题链接"></a>谈CAM的实战</h3>
<p>签约前要求房东提供过去3年的CAM历史数据：</p>
<ol>
<li>2024年CAM：$10800/年（$900/月）</li>
<li>2025年CAM：$11500/年（$958/月）涎幅 6.5%</li>
<li>2026年CAM：$12200/年（$1017/月）涎幅 6.1%</li>
</ol>
<p>看完这个历史后，你就能判断：</p>
<ul>
<li>这栋楼的维护质量如何</li>
<li>房东的费用控制能力如何</li>
<li>最近是否有大项目支出</li>
<li>未来的合理预算应该是多少</li>
</ul>
<hr>
<h2><a name="p-85625-h-16" class="anchor" href="#p-85625-h-16" aria-label="标题链接"></a>第三步：四大"致命"条款</h2>
<h3><a name="p-85625-personal-guarantee-17" class="anchor" href="#p-85625-personal-guarantee-17" aria-label="标题链接"></a>① 个人担保（Personal Guarantee）</h3>
<p>大多数房东要求新租户的股东进行个人担保。意思是：</p>
<p>如果生意亏损、公司倒闭，房东有权冻结你的个人银行账户、抵押你的房子来偿还剩余租金。</p>
<p>一个餐厅租5年、月租$8000，如果第2年因为疫情关闭，剩余48个月的租金是$384,000。房东可以直接起诉你个人。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>怎么谈</strong>：</p>
<ul>
<li>争取"有限担保"：只担保前2年或担保金额上限为$50,000</li>
<li>争取"自动解除"：营业满3年且无违约记录，自动解除担保</li>
<li>争取"逐年递减"：第1年100%担保，第2年80%，第3年0%</li>
<li>最差情况下：至少要求担保数额不超过12个月的租金</li>
</ul>
<h3><a name="p-85625-demolition-clause-18" class="anchor" href="#p-85625-demolition-clause-18" aria-label="标题链接"></a>② 拆迁条款（Demolition Clause）</h3>
<p>在温哥华Broadway、多伦多Yonge St这类高密度区域，房东常加这条：</p>
<p>“如果大楼拆迁改建，房东只需提前6个月通知，即可终止租约。”</p>
<p>场景：你花$50万装修了一家餐厅，第2年房东收到开发商的收购要约。房东给你6个月通知，你要搬家。5年租约变成2年，装修投入打水漂。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>怎么谈</strong>：</p>
<ul>
<li>争取"拆迁补偿"：至少给予3-6个月的租金作为搬迁补偿</li>
<li>争取"提前通知期"：延长至12个月</li>
<li>争取"装修摊销"：如果拆迁发生在租期内，房东补偿未摊销的装修成本</li>
</ul>
<h3><a name="p-85625-option-to-renew-19" class="anchor" href="#p-85625-option-to-renew-19" aria-label="标题链接"></a>③ 续租选择权（Option to Renew）</h3>
<p>这个很容易被忽视，但后果很严重。</p>
<p>住宅租约到期，通常自动转为按月。商业租约不同：<strong>到期就是到期，没有自动续租。</strong></p>
<p>如果合同里没有"Option to Renew"条款，租期到期那天：</p>
<ul>
<li>你的钥匙失效</li>
<li>房东可以把铺位转租给出价更高的人</li>
<li>你的生意就地解散</li>
</ul>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>怎么谈</strong>：</p>
<ul>
<li>必须争取至少2个续租选项，每次5年（总共15年）</li>
<li>必须写明：续租租金按"市场价"或"当前租金+X%"</li>
<li>必须明确行使方式：租期到期前6-12个月以书面形式通知房东</li>
</ul>
<h3><a name="p-85625-fixturing-period-rent-abatement-20" class="anchor" href="#p-85625-fixturing-period-rent-abatement-20" aria-label="标题链接"></a>④ 装修期和租金减免（Fixturing Period &amp; Rent Abatement）</h3>
<p>装修一家餐厅需要3个月，这期间你没有收入，但仍需支付租金。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>怎么谈</strong>：</p>
<ul>
<li>争取"免租期"：至少1-3个月的完全免租</li>
<li>次优方案：部分减免（如第1个月50%租金，第2-3个月75%租金）</li>
<li>写进合同具体的开工日期、装修期长度、减免的确切金额</li>
</ul>
<hr>
<h2><a name="p-85625-h-21" class="anchor" href="#p-85625-h-21" aria-label="标题链接"></a>第四步：算清真实月供</h2>
<p>不要被$30/平方英尺的报价迷惑。</p>
<p>假设你在多伦多看中一个1000平方英尺的商铺，经纪报价$3000/月（$36/平方英尺/年）。</p>
<p>第一次对话：问房东"总占用成本是多少？"</p>
<p>房东应该给你这样的清单：</p>
<div class="md-table">
<table>
<thead>
<tr>
<th>项目</th>
<th>金额</th>
</tr>
</thead>
<tbody>
<tr>
<td>Base Rent</td>
<td>$3,000</td>
</tr>
<tr>
<td>物业税分摊</td>
<td>$600</td>
</tr>
<tr>
<td>保险分摊</td>
<td>$200</td>
</tr>
<tr>
<td>CAM（公共维护费）</td>
<td>$800</td>
</tr>
<tr>
<td>小计</td>
<td>$4,600</td>
</tr>
<tr>
<td>HST (13%)</td>
<td>$598</td>
</tr>
<tr>
<td><strong>真实月供</strong></td>
<td><strong>$5,198</strong></td>
</tr>
</tbody>
</table>
</div><p>看起来贵了73%。现在你才知道真实成本。</p>
<p>什么时候要求这份清单：</p>
<ul>
<li>看Offer to Lease时（不是签字时）</li>
<li>要求房东逐项列出过去12个月的数字</li>
<li>要求房东给出未来3年的预估</li>
</ul>
<hr>

<h2><a name="p-85625-h-23" class="anchor" href="#p-85625-h-23" aria-label="标题链接"></a>真实场景：三个"翻车"故事</h2>
<h3><a name="p-85625-h-1cam-24" class="anchor" href="#p-85625-h-1cam-24" aria-label="标题链接"></a>场景1：CAM无底线</h3>
<p>小李在多伦多开了一家咖啡厅，看好了一个年租$36,000的铺位。合同上写基础租金$3000/月，CAM"按实际支出"，没有上限。</p>
<p>第1年：CAM $800/月（预期）<br>
第2年：CAM $1100/月（楼上发生水灾，修缮费摊销）<br>
第3年：CAM $1500/月（房东更换停车场）</p>
<p>小李的总月支出从$3800涨到$4500。生意利润微薄，几乎要关店。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>教训</strong>：合同里必须写"CAM年度涨幅不超过CPI+2%“或明确列出"资本支出不计入当年CAM”。</p>
<h3><a name="p-85625-h-2-25" class="anchor" href="#p-85625-h-2-25" aria-label="标题链接"></a>场景2：个人担保的隐患</h3>
<p>王女士和丈夫合伙开诊所，租了一个2000平方英尺的医疗楼铺位。</p>
<p>基础租金$6000/月，5年合同。</p>
<p>第3年，丈夫突然病重无法工作，生意开始亏损。第4年，无法继续支付租金。</p>
<p>房东根据合同的"无限个人担保"条款，起诉王女士。她要偿还剩余18个月的租金$108,000，连律师费一起，总额超过$150,000。</p>
<p>她的诊所、房子都被冻结。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>教训</strong>：签约前就应该争取"有限担保"（如担保金额上限为$50,000或6个月租金）或"时间限制"（仅前2年生效）。</p>
<h3><a name="p-85625-h-3-26" class="anchor" href="#p-85625-h-3-26" aria-label="标题链接"></a>场景3：拆迁通知</h3>
<p>张先生在温哥华Broadway租了一个100平方米的餐厅，租金$8000/月，装修投入$200,000。</p>
<p>租了18个月后，房东突然来电：</p>
<blockquote>
<p>“我们收到开发商的收购要约，会在6个月后拆迁。根据合同第15条，你需要搬家。”</p>
</blockquote>
<p>张先生的餐厅装修还没收回成本，就要全部撤出。最后转让价格很低，亏损严重。</p>
<p><img src="https://bbs.fcgvisa.com/images/emoji/apple/warning.png?v=15" title=":warning:" class="emoji" alt=":warning:" loading="lazy" width="20" height="20"> <strong>教训</strong>：合同里应该有"拆迁补偿条款"，至少给3-6个月的搬迁期，最好有补偿金额。</p>
<hr>
<h2><a name="p-85625-h-27" class="anchor" href="#p-85625-h-27" aria-label="标题链接"></a>按严重程度分级补救</h2>
<h3><a name="p-85625-offer-to-lease-28" class="anchor" href="#p-85625-offer-to-lease-28" aria-label="标题链接"></a><img src="https://bbs.fcgvisa.com/images/emoji/apple/red_circle.png?v=15" title=":red_circle:" class="emoji" alt=":red_circle:" loading="lazy" width="20" height="20"> 如果已经签了Offer to Lease</h3>
<p>立即行动（通常还有48-72小时反悔期）：</p>
<ol>
<li>不要付定金</li>
<li>发给商业地产律师，让他检查是否有约束力、是否有冷静期</li>
<li>在律师意见前不要做任何承诺</li>
</ol>
<h3><a name="p-85625-lease-29" class="anchor" href="#p-85625-lease-29" aria-label="标题链接"></a><img src="https://bbs.fcgvisa.com/images/emoji/apple/yellow_circle.png?v=15" title=":yellow_circle:" class="emoji" alt=":yellow_circle:" loading="lazy" width="20" height="20"> 如果已经签了正式Lease但还没交房</h3>
<p>立即行动：</p>
<ol>
<li>查合同条件、冷静期、房东交付义务</li>
<li>看能否在房东交房前修改核心条款（特别是个人担保、CAM上限、续租权）</li>
<li>联系律师评估违约赔偿 vs 被迫继续的成本</li>
</ol>
<h3><a name="p-85625-h-30" class="anchor" href="#p-85625-h-30" aria-label="标题链接"></a><img src="https://bbs.fcgvisa.com/images/emoji/apple/green_circle.png?v=15" title=":green_circle:" class="emoji" alt=":green_circle:" loading="lazy" width="20" height="20"> 如果已经在营业</h3>
<p>定期维护：</p>
<ol>
<li>保存每月的CAM账单明细（为日后审计准备）</li>
<li>建立与房东的书面沟通记录（邮件而非口头）</li>
<li>提前12个月准备续租谈判（不要等到倒计时）</li>
</ol>
<hr>
<h2><a name="p-85625-h-31" class="anchor" href="#p-85625-h-31" aria-label="标题链接"></a>常见问题</h2>
<p><strong>Q：租一个1000平方英尺的铺位，基础租金$3000，实际月供会是多少？</strong><br>
A：<strong>$4500-5500左右</strong>。包含物业税$400-600、保险$200、CAM$600-1000、HST$500-700。</p>
<p><strong>Q：能不能要求房东降低基础租金，自己承担CAM？</strong><br>
A：<strong>不行</strong>。NNN结构下，房东不会同意，因为他失去了运营收益。你可以谈的是"CAM有上限"和"可以审计"。</p>
<p><strong>Q：Lease还没签，但房东说"不用律师，我们很友好"？</strong><br>
A：<strong>一定要找律师</strong>。商业租约太复杂，一个条款漏洞可能导致几万块的损失或生意失败。律师费$2000-5000值得。</p>
<p><strong>Q：生意不景气，能要求房东减租吗？</strong><br>
A：<strong>很难</strong>。商业租约没有"生意不好"的法定减租条款。除非合同里明确写了Percentage Lease或其他调整条款，否则要靠你去谈。</p>
<p><strong>Q：租期5年，第3年想搬家，能不能提前终止？</strong><br>
A：<strong>看合同</strong>。有的合同允许"提前终止"但要付罚金（通常是3-6个月租金），有的不允许。必须签约前问清楚。</p>
<p><strong>Q：CAM里房东多收了钱，怎么办？</strong><br>
A：<strong>要求审计</strong>。如果合同赋予了你审计权，雇个会计或建筑管理公司审计过去12个月的CAM支出。通常能找出10%-20%的超收。</p>
<p><strong>Q：担保人还能改吗？</strong><br>
A：<strong>可以谈</strong>。如果你的个人信用变好，或者公司经营稳定3年了，可以书面要求房东解除担保。但要看合同里有无"自动解除条款"。</p>
<p><strong>Q：转租给别人，房东能阻止吗？</strong><br>
A：<strong>可能</strong>。大多数商业合同要求房东同意才能转租，房东可以设置条件（如新租户的信用审查）。必须看合同。</p>

<h2><a name="p-85625-h-33" class="anchor" href="#p-85625-h-33" aria-label="标题链接"></a>微出国最后总结</h2>
<p>商业租赁本质上是一场力量对等的合同谈判。房东有经验、有律师，租户通常匆匆签字。最大的亏是"信息不对称"。</p>
<p>一定要做的事：</p>
<ol>
<li>要求房东提供"总占用成本"清单，而不是单独的基础租金</li>
<li>过去3年的CAM历史数据，用来判断未来涨幅</li>
<li>合同让律师逐条检查（不是"大概看看"）</li>
<li>在Offer to Lease阶段就介入律师，成本最低</li>
</ol>
<p>一定不要做的事：</p>
<ol>
<li>只看基础租金做决定</li>
<li>相信房东"我们很友好，不用律师"的说法</li>
<li>签字前不问清续租权、拆迁条款、个人担保范围</li>
<li>没有CAM上限和审计权的情况下签约</li>
</ol>
<p>商业租赁几乎每个条款都能谈。律师的工作就是帮你争取最有利的条款。第一次可能会很"麻烦"，但这种麻烦是值得的。</p>
